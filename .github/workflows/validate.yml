name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CI dependencies from explicit public sources
        shell: pwsh
        run: |
          python -m venv .venv
          ./build/Install-DevDependencies.ps1 -AllowPublicPackageIndex -AllowPowerShellGallery

      - name: Run strict repository validation
        shell: pwsh
        run: |
          ./build/Test-Repository.ps1 `
            -RequirePSScriptAnalyzer `
            -BaseRef $env:VALIDATION_BASE_REF

      - name: Build diagnostic site artifact
        shell: pwsh
        run: ./.venv/Scripts/python.exe web/build_site.py --root . --output site

      - name: Upload diagnostic site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workshop-site-validation
          path: site
          if-no-files-found: error
          retention-days: 7
