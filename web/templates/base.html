<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ asset_prefix }}/styles.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs"></script>
  <script type="module" src="{{ asset_prefix }}/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header>
    <p class="site-title"><a href="{{ pages[0].href }}">{{ site.title }}</a></p>
    <p>{{ site.description }}</p>
  </header>
  <nav aria-label="Workshop modules">
    <ol><!--{% for item in pages %}-->
      <li>
        <a href="{{ item.href }}"{% if item.route == page.route %} aria-current="page"{% endif %}>
          <span>{{ item.phase }}</span>
          {{ item.title }}
        </a>
      </li>
      <!--{% endfor %}-->
    </ol>
  </nav>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Evidence-driven SQL tuning with human review. Do not run the workshop workload against production.</p>
  </footer>
</body>
</html>
